<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>My Animal Repository</title> <style>
        /* Farben direkt definiert, da @-Variablen kein Standard-CSS sind */
        html {
          background-color: #ffe9e9; /* Ein leichter Rosa-Ton */
        }

        h1 {
            text-align: center;
            font-size: 40pt;
            font-weight: normal;
            color: #444444; /* Dunkelgrau */
            margin-top: 30px;
            margin-bottom: 10px;
        }

        body {
          /* Moderne Schriftarten mit Fallbacks */
          font-family: 'Roboto', 'Helvetica Neue', Helvetica, Arial, sans-serif;
          font-style: normal;
          font-weight: 400;
          letter-spacing: 0;
          padding: 1rem;
          text-rendering: optimizeLegibility;
          -webkit-font-smoothing: antialiased;
          -moz-osx-font-smoothing: grayscale;
          /* -moz-font-feature-settings: "liga" on; */ /* Nicht weit unterstützt, oft unnötig */
          max-width: 900px; /* Responsiver als feste Breite */
          margin: auto; /* Zentriert den Body */
          color: #444444; /* Standardtextfarbe dunkelgrau */
        }

        .cards {
          list-style: none;
          margin: 0;
          padding: 0;
          display: grid; /* Modernes Layout mit Grid */
          /* Erzeugt Spalten, die mindestens 300px breit sind,
             aber flexibel wachsen, um den Platz zu füllen */
          grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
          gap: 30px; /* Abstand zwischen den Karten */
          margin-top: 40px;
        }

        .cards__item {
          background-color: white;
          border-radius: 0.25rem; /* 4px */
          box-shadow: 0 10px 20px -10px rgba(0,0,0,0.2); /* Subtilerer Schatten */
          overflow: hidden; /* Stellt sicher, dass nichts überläuft */
          padding: 1.5rem; /* Etwas mehr Innenabstand */
          /* margin: 50px;  <- Entfernt, da gap vom Grid übernommen wird */
          display: flex; /* Flexbox für interne Ausrichtung */
          flex-direction: column; /* Elemente untereinander */
        }

        .card__title {
          color: #696969; /* Grau */
          font-size: 1.25rem; /* 20px */
          font-weight: 600; /* Etwas dicker für bessere Lesbarkeit */
          letter-spacing: 1px; /* Weniger aggressiv */
          text-transform: uppercase;
          margin-bottom: 0.75rem; /* Abstand nach dem Titel */
        }

        .card__text {
          flex: 1 1 auto; /* Sorgt dafür, dass der Textbereich wächst */
          font-size: 0.95rem; /* 15.2px */
          line-height: 1.8; /* Besserer Zeilenabstand */
          margin-bottom: 0; /* Kein unterer Margin mehr nötig */
          color: #444444; /* Textfarbe */
        }

        .card__text strong {
          color: #444444; /* Hervorhebung etwas dunkler */
        }

        /* Stil für die Fehlermeldung, falls keine Tiere gefunden werden */
        h2 {
            text-align: center;
            color: #999999; /* Grau */
            font-size: 1.5rem;
            margin-top: 50px;
        }

        </style>
    </head>
    <body>
        <h1>My Animal Repository</h1>
        <ul class="cards">
            __REPLACE_ANIMALS_INFO__
        </ul>
    </body>
</html>
